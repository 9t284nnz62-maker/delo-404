<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Дело №404{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="grain"></div>

    <header class="topbar">
        <a href="{{ url_for('main.index') }}" class="topbar__brand">
            <span class="topbar__case">№404</span>
            <span class="topbar__label">Архив особых дел</span>
        </a>
        <nav class="topbar__nav">
            <a href="{{ url_for('main.index') }}">Главная</a>
        </nav>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>© {{ current_year }} Дело №404 · Учебный проект</span>
    </footer>

    <script src="{{ url_for('static', filename='js/desk.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
