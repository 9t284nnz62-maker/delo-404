{% extends "base.html" %}
{% block content %}
  <h1>Обвинение</h1>
  <p>Выберите, кто совершил кражу:</p>
  <form method="post" class="accuse-form">
    {% for key, s in suspects.items() %}
      <label class="suspect-card">
        <input type="radio" name="suspect" value="{{ key }}" required>
        <b>{{ s.name }}</b> — {{ s.role }}
        <span class="testimony">«{{ s.testimony }}»</span>
      </label>
    {% endfor %}
    <button class="btn" type="submit">Выдвинуть обвинение</button>
  </form>
{% endblock %}
